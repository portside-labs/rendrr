[package]
name = "rendrr"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Self-hostable HTTP service that renders DOCX templates (Handlebars syntax) into DOCX or PDF using only in-process libraries."
repository = "https://github.com/portside-labs/rendrr"
homepage = "https://github.com/portside-labs/rendrr"
readme = "README.md"
keywords = ["docx", "template", "handlebars", "word", "pdf"]
categories = ["template-engine", "web-programming::http-server"]
authors = ["Graham Sutton"]

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
tokio = { version = "1.36", features = ["full"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

docx-rs = "0.4"
handlebars = "6.4"

object_store = { version = "0.14", features = ["aws"] }

uuid = { version = "1.7", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
dotenvy = "0.15"

bytes = "1.5"
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

zip = "0.6"
regex = "1.10"

# Optional OAuth 2.0 / OIDC bearer-token validation
jsonwebtoken = "9"
moka = { version = "0.12", features = ["future"] }

reqwest = { version = "0.12", features = ["json"] }
base64 = "0.21"
image = "0.25"
futures = "0.3"

# In-process DOCX -> PDF rendering (Skia-backed, no external service)
dxpdf = "0.5"

[dev-dependencies]
tokio = { version = "1.36", features = ["macros", "rt", "rt-multi-thread"] }
serde_json = "1.0"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
