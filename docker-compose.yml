# Contributor dev stack. Brings up just the storage layer (MinIO + bucket
# creation) so you can run Rendrr locally via `cargo run`. End users should
# *not* use this file — see the Getting Started guide in the docs for a
# self-contained compose recipe that includes the Rendrr container itself.

services:
  minio:
    image: minio/minio:latest
    container_name: rendrr-minio
    ports:
      - "9002:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - rendrr-network

  minio-init:
    image: minio/mc:latest
    container_name: rendrr-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/rendrr-templates --ignore-existing;
      /usr/bin/mc mb myminio/rendrr-renders --ignore-existing;
      echo 'Buckets created';
      exit 0;
      "
    networks:
      - rendrr-network

volumes:
  minio-data:
    driver: local

networks:
  rendrr-network:
    driver: bridge
