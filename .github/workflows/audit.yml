name: Audit

on:
  push:
    branches: [main, master]
    paths: ["**/Cargo.toml", "**/Cargo.lock", ".github/workflows/audit.yml"]
  pull_request:
    paths: ["**/Cargo.toml", "**/Cargo.lock", ".github/workflows/audit.yml"]
  schedule:
    # Advisories land after a PR merges, so a weekly run catches the ones a
    # push-triggered job never would.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      # Plain `cargo audit` fails on vulnerabilities but not on "unmaintained"
      # warnings. Those warnings fire on transitive crates we don't choose and
      # often have no fixed version, so treating them as fatal would wedge CI
      # on something no change to this repo can resolve.
      #
      # The two ignored advisories are quick-xml DoS bugs reachable only
      # through object_store, which uses it to parse XML responses from the
      # configured S3 endpoint — operator-controlled infrastructure, not
      # caller-supplied input, so the exposure is materially lower than the
      # advisory's general case. The fix needs object_store 0.14, whose trait
      # methods return `impl Future` and so no longer work through the
      # `Arc<dyn ObjectStore>` that StorageClient is built on. Tracked in
      # issue #15; remove these ignores with that upgrade.
      - name: Check for known vulnerabilities
        run: |
          cargo audit \
            --ignore RUSTSEC-2026-0194 \
            --ignore RUSTSEC-2026-0195
