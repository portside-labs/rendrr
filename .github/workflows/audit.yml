name: Audit

on:
  push:
    branches: [main, master]
    paths: ["**/Cargo.toml", "**/Cargo.lock", ".github/workflows/audit.yml"]
  pull_request:
    paths: ["**/Cargo.toml", "**/Cargo.lock", ".github/workflows/audit.yml"]
  schedule:
    # Advisories land after a PR merges, so a weekly run catches the ones a
    # push-triggered job never would.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      # Plain `cargo audit` fails on vulnerabilities but not on "unmaintained"
      # warnings. Those warnings fire on transitive crates we don't choose and
      # often have no fixed version, so treating them as fatal would wedge CI
      # on something no change to this repo can resolve.
      - name: Check for known vulnerabilities
        run: cargo audit
