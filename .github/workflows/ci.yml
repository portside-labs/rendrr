name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system build deps (dxpdf links Skia)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build python3 \
            libfontconfig1-dev libfreetype-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system build deps (dxpdf links Skia)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build python3 \
            libfontconfig1-dev libfreetype-dev pkg-config

      # The toolchain is read from `rust-version` in Cargo.toml rather than
      # hardcoded here. Pinning it in both places let them drift: a dependency
      # bump raised the real floor and this job kept testing the old one.
      #
      # The floor comes from the dependency tree, not from anything in this
      # repo's own source, so a routine Dependabot bump can raise it.
      - name: Read MSRV from Cargo.toml
        id: msrv
        run: |
          msrv="$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)"
          echo "version=${msrv}" >> "$GITHUB_OUTPUT"
          echo "MSRV from Cargo.toml: ${msrv}"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@v2

      - name: Build against MSRV
        run: cargo build --all-targets
