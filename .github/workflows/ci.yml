name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system build deps (dxpdf links Skia)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake libfontconfig1-dev libfreetype-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system build deps (dxpdf links Skia)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake libfontconfig1-dev libfreetype-dev pkg-config

      # Pinned to the `rust-version` in Cargo.toml, which is set by the
      # dependency tree (image/time need 1.88, and dxpdf pulls clap, which
      # needs edition2024) rather than by anything in our own source. Without
      # this job the `stable` job would happily compile code the documented
      # MSRV can't build.
      - uses: dtolnay/rust-toolchain@1.88.0

      - uses: Swatinem/rust-cache@v2

      - name: Build against MSRV
        run: cargo build --all-targets
