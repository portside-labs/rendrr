name: Release

# Publishes a multi-arch container image to GHCR for every `v*` tag. Creating
# a GitHub Release through the UI pushes the tag, so that path triggers this
# too — there's no separate `release:` trigger, which would double-fire.
on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # A tag push must not publish an image that doesn't pass its own test suite.
  verify:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The binary reports CARGO_PKG_VERSION from `--version` and `/health`, so
      # a tag that disagrees with Cargo.toml would publish an image whose tag
      # and self-reported version don't match. Catch it before anything builds.
      - name: Tag matches Cargo.toml version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [ "$tag_version" != "$cargo_version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} implies version ${tag_version}, but Cargo.toml says ${cargo_version}. Bump Cargo.toml (and Cargo.lock) before tagging."
            exit 1
          fi
          echo "Version ${cargo_version} matches tag ${GITHUB_REF_NAME}."

      - name: Install system build deps (dxpdf links Skia)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake libfontconfig1-dev libfreetype-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # Each architecture builds on a native runner and pushes an untagged image
  # by digest; the `merge` job then stitches the digests into one manifest
  # list. Building arm64 under QEMU emulation instead would mean emulating
  # dxpdf's Skia C++ compile, which is slow enough to risk the 6-hour job
  # limit — native arm64 runners avoid the emulation entirely.
  build:
    name: Build ${{ matrix.platform }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Labels only — the tags are applied once, in the merge job, against the
      # manifest list rather than the per-arch images.
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          # Cache is scoped per-arch so the two jobs don't evict each other.
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${{ steps.build.outputs.digest }}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish manifest
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Required by attest-build-provenance to sign the published image.
      id-token: write
      attestations: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `latest=auto` moves the `latest` tag only for a non-prerelease
          # semver tag, so `v1.0.0-rc1` publishes as `1.0.0-rc1` without
          # dragging `latest` onto a release candidate.
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect published image
        run: |
          docker buildx imagetools inspect \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

      - name: Resolve manifest digest
        id: digest
        run: |
          digest="$(docker buildx imagetools inspect \
            --format '{{json .Manifest}}' \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }} \
            | jq -r .digest)"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      # Lets consumers verify the image was built by this workflow from this
      # repo, rather than pushed by hand:
      #   gh attestation verify oci://ghcr.io/portside-labs/rendrr:<tag> \
      #     --repo portside-labs/rendrr
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
